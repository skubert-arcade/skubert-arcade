<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Skubert Typing Frenzy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6"
      crossorigin="anonymous"
    />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="../../assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/game.css" />
    <!-- Shared score-entry UI used across the arcade. -->
    <link rel="stylesheet" href="../../shared/score-entry.css" />

    <!-- 3D Skubert overlay: does not capture clicks or typing input -->
    <style>
      
#Wrapper {
  position: relative;
  isolation: isolate;
}

/* Skubert's 3D model — lower layer */
#skubert-viewer {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}

#skubert-viewer canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* Falling words — upper layer */
#GameContent {
  position: relative;
  z-index: 2;
}

/* Only adjust the layout after a typing run ends. Gameplay is unchanged. */
#GameContent.sk-typing-ended {
  height: auto !important;
  min-height: 600px;
  align-items: flex-start !important;
  overflow-y: auto;
  padding: 12px 8px 22px;
}
#GameContent.sk-typing-ended .modal-gameover {
  width: min(100%, 500px) !important;
  max-width: 100% !important;
  flex: 0 1 auto !important;
  margin: 12px auto;
  padding: 20px 15px;
  border-radius: 16px;
}
#GameContent .typing-score-entry { width: 100%; }
/* Keep the shared widget legible even if the game's styles override buttons. */
#GameContent .sk-score__initials {
  border: 2px solid #9ab0cf !important;
  border-radius: 10px !important;
}
#GameContent .sk-score__submit {
  border: 1px solid #0032b1 !important;
  border-radius: 10px !important;
}
#GameContent .sk-score__row { text-align: left; }
@media (max-width: 520px) {
  #GameContent.sk-typing-ended .modal-gameover { padding: 12px 8px; }
}

    </style>

    <!-- Start downloading the heavy GLB before the module loader is ready. -->
    <link rel="preload" href="./models/skubert.glb" as="fetch" crossorigin="anonymous" fetchpriority="high" />

    <!-- Keep Three.js and its GLTF loader on the same pinned version -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-transparent px-5">
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse ml-0" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item active">
            <a class="nav-link" href="https://skubert-arcade.github.io/skubert-arcade/index.html">Arcade</a>
          </li>
          <li class="nav-item">
          </li>
          <li class="nav-item">
          </li>
        </ul>
      </div>
    </nav>

    <div id="Wrapper" class="wrapper">
      <div class="container-data">
        <div id="Score" class="score">Score: 0</div>
        <div id="Level" class="level">Level:</div>
      </div>

      <div
        id="GameContent"
        class="row game-content justify-content-center align-items-center"
      ></div>
      <!-- 3D overlay stays mounted when the words are cleared on game-over -->
      <div id="skubert-viewer" aria-hidden="true"></div>


      <form onsubmit="getWord(); return false">
        <input
          type="text"
          id="InputWord"
          class="form-control form-control-lg"
          autofocus
        />
        <input type="submit" hidden />
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
      crossorigin="anonymous"
    ></script>

    <audio id="StartGameSound"></audio>
    <audio id="GameoverSound"></audio>
    <audio id="PointSound"></audio>
    <audio id="NotPointSound"></audio>
    <audio id="MenuSound"></audio>

    <!-- Load the Cloudflare-backed leaderboard and shared form before gameplay. -->
    <script src="../../shared/leaderboard.js"></script>
    <script src="../../shared/score-entry.js"></script>
    <script src="./app.js"></script>
    <!-- Avoid audio calls made by app.js when using silent placeholders -->
    <script>window.playSound = function () {};</script>
    <script type="module" src="./skubert-viewer.js"></script>
  </body>
</html>
