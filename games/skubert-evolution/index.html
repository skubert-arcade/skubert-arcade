<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <title>Skubert Evolution | Skubert Arcade</title>
  <style>
:root { color-scheme:light; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color:#181818; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#fafafa; }
a { color:#26384a; text-decoration:none; }
button { font:inherit; cursor:pointer; }
button:focus-visible,a:focus-visible,canvas:focus-visible { outline:3px solid #e89313; outline-offset:3px; }
.page { width:min(100%,1180px); margin:auto; padding:16px 16px 22px; }
.scene { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,416px); align-items:center; gap:clamp(12px,2vw,28px); min-height:calc(100svh - 38px); }
/* The original 1254×1254 PNG is always shown whole, unaltered, and fully opaque. */
.taxonomy-art { width:100%; display:flex; justify-content:center; align-items:center; overflow:visible; }
.taxonomy-art img { width:100%; height:auto; max-height:calc(100svh - 44px); object-fit:contain; display:block; opacity:1; }
.game-column { width:100%; max-width:416px; justify-self:center; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; }
.title { margin:0; font-size:clamp(16px,2vw,19px); font-weight:850; letter-spacing:-.035em; text-align:center; }
.btn { min-width:0; border:1px solid #d5d9dc; border-radius:10px; padding:9px 10px; color:#20262c; background:#fff; font-weight:750; }
.btn:hover { background:#f0f3f5; }
.btn.primary { background:#315e94; color:#fff; border-color:#315e94; }
.btn.primary:hover { background:#204e85; }
.board-card { background:#fff; border:1px solid #d5d5d5; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px #2222; }
.hud { display:grid; grid-template-columns:1fr 1fr 1.35fr; gap:5px; padding:7px; border-bottom:1px solid #dedede; }
.stat { min-width:0; padding:4px 7px; border-radius:7px; background:#f4f5f6; }
.stat .key { display:block; color:#61656a; font-size:10px; text-transform:uppercase; letter-spacing:.045em; font-weight:800; }
.stat .value { display:block; margin-top:2px; font-variant-numeric:tabular-nums; font-size:20px; font-weight:900; }
.next-row { display:flex; align-items:center; gap:6px; padding-top:4px; }
.next-orb { display:block; flex:none; width:20px; height:20px; border:1px solid #fff9; border-radius:50%; background:#8db45e; }
.next-name { font-size:11px; font-weight:750; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.arena { position:relative; background:#d0a575; }
canvas { width:100%; height:clamp(415px,63svh,565px); display:block; cursor:crosshair; touch-action:none; }
.status { display:flex; flex-direction:column; gap:2px; font-size:11px; padding:7px 10px; line-height:1.25; color:#505050; background:#fff; border-top:1px solid #ececec; }
.status #dropPool { font-size:10px; color:#666; overflow-wrap:anywhere; }
.status #progress { color:#333; font-weight:750; }
.controls { display:grid; grid-template-columns:1fr 1.45fr 1fr; gap:7px; padding:7px; border-top:1px solid #eee; }
.controls .btn { padding:9px; }
.overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:15px; background:#161616a0; z-index:3; }
.overlay[hidden] { display:none; }
.modal { background:#fff; color:#222; border-radius:16px; text-align:center; padding:22px 18px; width:min(100%,330px); box-shadow:0 16px 32px #0005; }
.modal h2 { margin:0 0 6px; font-size:26px; }
.modal p { margin:3px 0; line-height:1.4; font-size:13px; }
.final-score { font-size:28px; font-weight:900; margin:10px 0 5px; }
#ladder { display:none; }
@media (max-width:760px) {
 .page { padding:8px 9px 18px; }
 .scene { grid-template-columns:1fr; min-height:0; gap:8px; }
 .taxonomy-art img { width:auto; max-width:100%; height:min(21svh,175px); max-height:none; }
 .game-column { width:min(100%,416px); }
 canvas { height:clamp(390px,53svh,545px); }
 .stat .value { font-size:18px; }
}
@media (prefers-reduced-motion:reduce) { .btn { transition:none; } }
</style>
</head>
<body>
<div class="page">
  <div class="scene">
    <div class="taxonomy-art">
      <img src="taxonomy-ranking-system.png" alt="Taxonomic ranking system pyramid, from Eukarya through more specific biological classifications" width="1254" height="1254" decoding="async">
    </div>
    <div class="game-column">
      <header class="topbar">
        <a href="../../index.html" class="btn" aria-label="Back to Skubert Arcade">← Arcade</a>
        <h1 class="title">Skubert Evolution</h1>
        <button id="restartTop" class="btn" type="button" aria-label="Start a new game">↻ Restart</button>
      </header>
      <main class="board-card" aria-label="Skubert Evolution game">
        <div class="hud">
          <div class="stat"><span class="key">Score</span><span id="score" class="value">0</span></div>
          <div class="stat"><span class="key">Best</span><span id="best" class="value">0</span></div>
          <div class="stat"><span class="key">Next drop</span><span class="next-row"><span class="next-orb" id="nextOrb"></span><span id="nextName" class="next-name">Eukarya</span></span></div>
        </div>
        <div class="arena">
          <canvas id="game" tabindex="0" aria-label="Drop the spheres. Identical classifications merge into the next, larger classification."></canvas>
          <div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="endTitle">
            <div class="modal">
              <h2 id="endTitle">Game Over</h2>
              <p id="endMessage">The box overflowed.</p>
              <div id="endScore" class="final-score">0</div>
              <button id="playAgain" class="btn primary" type="button">Play again</button>
            </div>
          </div>
        </div>
        <div class="status">
          <span id="message" aria-live="polite">Aim with mouse or arrows. Click, tap, or press Space to drop.</span>
          <span id="progress">Highest: Eukarya</span>
          <span id="dropPool">Available drops: Eukarya</span>
        </div>
        <div class="controls">
          <button id="leftButton" type="button" class="btn" aria-label="Aim left">◀</button>
          <button id="dropButton" type="button" class="btn primary">Drop ↓</button>
          <button id="rightButton" type="button" class="btn" aria-label="Aim right">▶</button>
        </div>
      </main>
      <div id="ladder" hidden></div>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const LEVELS = [
    { name:'Eukarya', color:'#8db45e' },
    { name:'Animalia', color:'#efb92d' },
    { name:'Chordata', color:'#25b9b9' },
    { name:'Vertebrata', color:'#48a7f3' },
    { name:'Mammalia', color:'#b18be7' },
    { name:'Primates', color:'#f36d78' },
    { name:'Hominidae', color:'#ad315d' },
    { name:'Ponginae', color:'#f18a35' },
    { name:'Gigantopithecus', color:'#7840c6' },
    { name:'Skubert', color:'#1677e5' }
  ];
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  if(!ctx) { document.getElementById('message').textContent='Your browser does not support Canvas 2D.'; return; }
  const $=id=>document.getElementById(id);
  const scoreEl=$('score'), bestEl=$('best'), nextNameEl=$('nextName'), nextOrbEl=$('nextOrb');
  const overlay=$('overlay'), endTitle=$('endTitle'), endMessage=$('endMessage'), endScore=$('endScore');
  const fmt=new Intl.NumberFormat('en-US');
  const storageKey='skubertEvolutionPrototypeBestV1';
  let best=0;
  try { best=Number(localStorage.getItem(storageKey))||0; } catch (_) {}
  bestEl.textContent=fmt.format(best);
  const ladder=$('ladder');
  const levelRows=[];
  LEVELS.forEach((level,i)=>{
    const row=document.createElement('div'); row.className='level'+(i===9?' goal':'');
    const rank=document.createElement('span'); rank.className='rank'; rank.textContent=String(i+1);
    const dot=document.createElement('span'); dot.className='dot'; dot.style.setProperty('--orb',level.color);
    const name=document.createElement('span'); name.className='name'; name.textContent=level.name;
    row.append(rank,dot,name); ladder.append(row); levelRows.push(row);
  });
  let W=400,H=560, left=24,right=376,floor=536,boxTop=82,overflowY=169;
  let radius0=18,balls=[],particles=[],floating=[],shockwaves=[],score=0,highest=0;
  let unlocked=new Set([0]);
  let aimX=200,current=0,next=1,ended=false,win=false,overflowAge=0,dropWait=0;
  let time=0,lastMergeTime=-100,combo=0,lastFrame=0,accumulator=0,down=false,ballId=0;
  const step=1/60;
  const factor=1.23;
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  const radius=level=>radius0*Math.pow(factor,level);
  // Only classifications previously produced by an actual merge can enter the drop queue.
  // Weight later stages higher and discount those already filling the container.
  function choice(){
    const available=Array.from(unlocked).filter(level=>level<LEVELS.length-1);
    const counts=new Array(LEVELS.length).fill(0);
    for(const ball of balls)counts[ball.level]++;
    const weights=available.map(level=>(1+level*.72)/Math.pow(1+counts[level]*.68,1.15));
    let roll=Math.random()*weights.reduce((sum,w)=>sum+w,0);
    for(let i=0;i<available.length;i++)if((roll-=weights[i])<=0)return available[i];
    return available[available.length-1]??0;
  }
  function updateUnlocks(){
    for(let level=0;level<levelRows.length;level++){
      const isUnlocked=unlocked.has(level);
      levelRows[level].classList.toggle('unlocked',isUnlocked);
      levelRows[level].classList.toggle('locked',!isUnlocked);
      levelRows[level].title=isUnlocked?'Created through merging':'Not created yet';
    }
    const available=Array.from(unlocked).filter(level=>level<9).sort((a,b)=>a-b);
    $('dropPool').textContent='Available drops: '+available.map(level=>LEVELS[level].name).join(' · ');
  }
  function setMessage(value){$('message').textContent=value;}
  function updateNext(){nextNameEl.textContent=LEVELS[next].name;nextOrbEl.style.background=`radial-gradient(circle at 30% 25%,#fff9,${LEVELS[next].color} 65%,#262137)`;}
  function updateScore(){scoreEl.textContent=fmt.format(score);if(score>best){best=score;bestEl.textContent=fmt.format(best);try{localStorage.setItem(storageKey,String(best));}catch(_){}}}
  function resize(){
    const rect=canvas.getBoundingClientRect();
    const newW=Math.max(250,rect.width),newH=Math.max(360,rect.height);
    const oldW=W,oldH=H,oldR=radius0;
    W=newW;H=newH;left=20;right=W-20;floor=H-19;boxTop=84;overflowY=boxTop+87;
    radius0=clamp(W*.039,15.5,20.5);
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(balls.length){
      const sx=(right-left)/Math.max(1,oldW-40),sy=(floor-boxTop)/Math.max(1,oldH-103);
      for(const b of balls){b.x=left+(b.x-20)*sx;b.y=boxTop+(b.y-84)*sy;b.r=radius(b.level);b.x=clamp(b.x,left+b.r,right-b.r);b.y=Math.min(b.y,floor-b.r);}
    }
    aimX=clamp(aimX*W/Math.max(1,oldW),left+radius(current),right-radius(current));
  }
  function reset(){
    balls=[];particles=[];floating=[];shockwaves=[];score=0;highest=0;unlocked=new Set([0]);
    aimX=W/2;current=choice();next=choice();updateUnlocks();
    ended=false;win=false;overflowAge=0;dropWait=0;combo=0;lastMergeTime=-100;time=0;ballId=0;
    overlay.hidden=true;updateScore();updateNext();$('progress').textContent='Highest: Eukarya';
    setMessage('Aim with mouse, touch, or arrows. Click / Space to drop.');
    canvas.focus({preventScroll:true});
  }
  function createBall(level,x,y,vx=0,vy=0){
    const r=radius(level);
    return {id:++ballId,level,r,x:clamp(x,left+r,right-r),y,vx,vy,angle:0,omega:0,
      squish:0,squishV:0,squishAxis:0,lastImpact:-10,born:time,pulse:0};
  }
  function drop(){
    if(ended||dropWait>0)return;
    const r=radius(current),x=clamp(aimX,left+r,right-r);
    balls.push(createBall(current,x,boxTop-r-10,0,15));
    current=next;next=choice();updateNext();dropWait=.28;
    aimX=clamp(aimX,left+radius(current),right-radius(current));
    setMessage(`Dropped ${LEVELS[balls[balls.length-1].level].name}. Match two to evolve!`);
  }
  // Visual soft-body response: spring-driven deformation layered over stable circle colliders.
  // This creates squash/stretch without making the collision solver unpredictable.
  function impact(ball, normalX, normalY, speed){
    if(speed<65 || time-ball.lastImpact<.055)return;
    ball.lastImpact=time;
    ball.squishAxis=Math.atan2(normalY,normalX);
    ball.squish=clamp(ball.squish + Math.min(.24, speed*.00048), -.20, .29);
    ball.squishV=Math.max(ball.squishV, Math.min(2.6,speed*.004));
  }
  function makeParticles(x,y,color,n=14){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=45+Math.random()*175;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-42,life:.55+Math.random()*.3,max:.85,color,r:2+Math.random()*3});
    }
    if(particles.length>140)particles.splice(0,particles.length-140);
  }
  function mergeAt(i,j){
    const a=balls[i],b=balls[j];
    const newLevel=a.level+1;
    const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    const vx=(a.vx+b.vx)*.35,vy=-Math.min(480,205+newLevel*26+combo*12);
    // Delete higher index first so the lower index stays valid.
    balls.splice(j,1);balls.splice(i,1);
    const merged=createBall(newLevel,cx,Math.min(cy,floor-radius(newLevel)),vx,vy);
    merged.angle=(a.angle+b.angle)/2;
    merged.omega=clamp((a.omega+b.omega)*.38+(Math.random()-.5)*2.8,-12,12);
    merged.squish=.25; merged.squishV=-2.2; merged.squishAxis=Math.PI/2;
    // Newly merged bodies receive a short overflow grace period while the pile reacts.
    merged.born=time;merged.pulse=.26;balls.push(merged);
    // An outward shockwave turns each merge into a visible, physical event.
    // Nearby small spheres move more than larger, heavier spheres.
    const range=merged.r*3.1+70;
    for(const other of balls){
      if(other===merged)continue;
      let dx=other.x-cx,dy=other.y-cy;
      const dist=Math.hypot(dx,dy)||1;
      const reach=Math.max(0,1-dist/range);
      if(reach===0)continue;
      if(dist<1){dx=(Math.random()-.5)*2;dy=-1;}
      const massResponse=clamp(Math.pow(merged.r/other.r,.7),.35,2);
      const kick=(130+newLevel*19)*reach*massResponse;
      const norm=Math.hypot(dx,dy)||1;
      other.vx+=(dx/norm)*kick;
      other.vy+=(dy/norm)*kick-kick*.30;
      other.pulse=Math.max(other.pulse,.095);
      other.squishAxis=Math.atan2(dy,dx);
      other.squish=clamp(other.squish+reach*.095,-.18,.24);
      other.squishV+=reach*.45;
      // Off-center pressure spins nearby medallions, including their printed labels.
      other.omega=clamp(other.omega+(dx/Math.max(1,dist))*(dy>0?-1:1)*reach*2.5,-15,15);
    }
    shockwaves.push({x:cx,y:cy,r:merged.r*.35,maxR:range*.55,life:.35,maxLife:.35,color:LEVELS[newLevel].color});
    combo=(time-lastMergeTime)<1.35?Math.min(combo+1,8):1;
    lastMergeTime=time;
    const awarded=20*Math.pow(2,newLevel-1)*combo;
    score+=awarded;updateScore();
    makeParticles(cx,cy,LEVELS[newLevel].color,newLevel>=6?22:13);
    floating.push({x:cx,y:cy,life:1.05,label:`+${fmt.format(awarded)}  ${LEVELS[newLevel].name}`,color:LEVELS[newLevel].color});
    if(floating.length>8)floating.shift();
    if(!unlocked.has(newLevel)){unlocked.add(newLevel);updateUnlocks();}
    if(newLevel>highest){highest=newLevel;$('progress').textContent='Highest: '+LEVELS[newLevel].name;}
    setMessage(`${LEVELS[a.level].name} + ${LEVELS[b.level].name} → ${LEVELS[newLevel].name}${combo>1?' · '+combo+'× combo!':''}`);
    if(newLevel===9)endGame(true);
  }
  function collide(a,b){
    let dx=b.x-a.x,dy=b.y-a.y,dist2=dx*dx+dy*dy;
    const min=a.r+b.r;
    if(dist2>=min*min)return false;
    if(dist2<.00001){dx=.01;dy=-.01;dist2=dx*dx+dy*dy;}
    const dist=Math.sqrt(dist2),nx=dx/dist,ny=dy/dist;
    const invA=1/(a.r*a.r),invB=1/(b.r*b.r),sum=invA+invB;
    const correction=(min-dist)*.90/sum;
    a.x-=nx*correction*invA;a.y-=ny*correction*invA;
    b.x+=nx*correction*invB;b.y+=ny*correction*invB;
    const rvx=b.vx-a.vx,rvy=b.vy-a.vy,normalSpeed=rvx*nx+rvy*ny;
    if(normalSpeed<0){
      // Lively impacts, but low restitution for near-rest contacts prevents endless jitter.
      const impactSpeed=-normalSpeed;
      const restitution=normalSpeed < -75 ? .55 : .04;
      impact(a,-nx,-ny,impactSpeed);
      impact(b,nx,ny,impactSpeed);
      const impulse=-(1+restitution)*normalSpeed/sum;
      a.vx-=impulse*nx*invA;a.vy-=impulse*ny*invA;
      b.vx+=impulse*nx*invB;b.vy+=impulse*ny*invB;
      const tx=-ny,ty=nx;
      const tangentSpeed=rvx*tx+rvy*ty;
      const tangentImpulse=clamp(-tangentSpeed/sum,-impulse*.21,impulse*.21);
      a.vx-=tangentImpulse*tx*invA;a.vy-=tangentImpulse*ty*invA;
      b.vx+=tangentImpulse*tx*invB;b.vy+=tangentImpulse*ty*invB;
      // Tangential collision impulse produces angular velocity.
      a.omega=clamp(a.omega+tangentSpeed*.008*(24/Math.max(12,a.r)),-15,15);
      b.omega=clamp(b.omega+tangentSpeed*.008*(24/Math.max(12,b.r)),-15,15);
    }
    return true;
  }
  function physics(dt){
    time+=dt;dropWait=Math.max(0,dropWait-dt);
    if(ended)return;
    for(const b of balls){
      b.vy+=2350*dt;b.vx*=.998;b.vy*=.999;
      b.pulse=Math.max(0,b.pulse-dt);
      b.vx=clamp(b.vx,-1100,1100);b.vy=clamp(b.vy,-1150,1150);
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.omega*=.997;
      b.angle+=b.omega*dt;
      // Damped spring produces a short, elastic wobble after impact.
      b.squishV+=(-150*b.squish-17*b.squishV)*dt;
      b.squish=clamp(b.squish+b.squishV*dt,-.24,.3);
    }
    let merges=0;
    for(let pass=0;pass<4;pass++){
      for(const b of balls){
        if(b.x-b.r<left){b.x=left+b.r;if(b.vx<0){impact(b,1,0,-b.vx);b.vx*=-.48;b.omega=clamp(b.omega+b.vy*.001,-15,15);}}
        if(b.x+b.r>right){b.x=right-b.r;if(b.vx>0){impact(b,-1,0,b.vx);b.vx*=-.48;b.omega=clamp(b.omega-b.vy*.001,-15,15);}}
        if(b.y+b.r>floor){
          b.y=floor-b.r;
          if(b.vy>0){
            impact(b,0,-1,b.vy);
            b.vy=b.vy>70?-b.vy*.44:0;
          }
          b.vx*=.955;
          // Rolling contact: horizontal movement drives rotation until the ball rests.
          b.omega+=(b.vx/Math.max(1,b.r)-b.omega)*.10;
        }
      }
      let didMerge=false;
      outer:for(let i=0;i<balls.length;i++){
        for(let j=i+1;j<balls.length;j++){
          const a=balls[i],b=balls[j];
          const dx=b.x-a.x,dy=b.y-a.y,s=a.r+b.r;
          if(dx*dx+dy*dy>=s*s)continue;
          if(a.level===b.level&&a.level<9&&merges<7){mergeAt(i,j);merges++;didMerge=true;break outer;}
          collide(a,b);
        }
      }
      if(ended)break;
      if(didMerge){pass=-1;continue;}
    }
    const isOverflow=balls.some(b=>time-b.born>1.65 && b.y-b.r<overflowY && b.y+b.r>boxTop && Math.abs(b.vy)<100);
    overflowAge=clamp(overflowAge+(isOverflow?dt:-dt*2),0,3);
    if(overflowAge>=3)endGame(false);
    for(let i=shockwaves.length-1;i>=0;i--){const w=shockwaves[i];w.life-=dt;w.r+=(w.maxR-w.r)*Math.min(1,dt*11);if(w.life<=0)shockwaves.splice(i,1);}
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy+=170*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1);}
    for(let i=floating.length-1;i>=0;i--){floating[i].life-=dt;floating[i].y-=25*dt;if(floating[i].life<=0)floating.splice(i,1);}
  }
  function endGame(won){
    if(ended)return;
    ended=true;win=won;endTitle.textContent=won?'You made Skubert! 🎉':'Box overflowed!';
    endMessage.textContent=won?'You completed all ten classifications.':'Keep merging matching spheres to make room in the box.';
    endScore.textContent=fmt.format(score)+' points';
    overlay.hidden=false;
    $('playAgain').focus({preventScroll:true});
  }
  function hexRGB(hex){const c=hex.replace('#','');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
  function tint(hex,t){const rgb=hexRGB(hex);return `rgb(${rgb.map(n=>Math.round(n+(t>=0?(255-n):n)*t)).join(',')})`;}
  function drawSphere(x,y,r,level,ghost=false,pulse=0,angle=0,squish=0,squishAxis=0){
    const color=LEVELS[level].color;
    ctx.save();
    ctx.globalAlpha=ghost?.85:1;
    ctx.translate(x,y);
    const puff=pulse>0?(1+.10*pulse/.26):1;
    ctx.scale(puff,puff);
    // Keep the body physically circular while rendering an elastic soft sphere.
    // The deformation axis follows the impact normal, independently of surface rotation.
    ctx.rotate(squishAxis);
    ctx.scale(1-clamp(squish,-.24,.3),1+clamp(squish,-.24,.3)*.7);
    ctx.rotate(-squishAxis);
    // Everything painted onto the surface (including the text) rotates with the sphere.
    ctx.rotate(angle);
    ctx.shadowColor='#20170d75';ctx.shadowBlur=8;ctx.shadowOffsetY=4;
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
    const gradient=ctx.createRadialGradient(-r*.42,-r*.54,r*.08,r*.22,r*.27,r*1.35);
    gradient.addColorStop(0,tint(color,.52));gradient.addColorStop(.47,color);gradient.addColorStop(1,tint(color,-.51));
    ctx.fillStyle=gradient;ctx.fill();
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.strokeStyle=tint(color,-.57);ctx.lineWidth=Math.max(1.3,r*.055);ctx.stroke();
    ctx.save();ctx.beginPath();ctx.arc(0,0,r-1,0,Math.PI*2);ctx.clip();
    ctx.beginPath();ctx.ellipse(-r*.31,-r*.47,r*.38,Math.max(2,r*.13),-.45,0,Math.PI*2);
    ctx.fillStyle='#fff9';ctx.fill();
    ctx.beginPath();ctx.arc(r*.29,r*.28,r*.62,0,Math.PI*2);
    ctx.strokeStyle='#fff2';ctx.lineWidth=Math.max(2,r*.12);ctx.stroke();
    // Printed lettering is part of the ball texture: it is not screen-aligned.
    const label=LEVELS[level].name;
    let fontSize=clamp(r*.56,9,level===9?29:22);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.font=`900 ${fontSize}px system-ui,Arial,sans-serif`;
    const maxWidth=r*1.76;
    if(ctx.measureText(label).width>maxWidth){
      fontSize=Math.max(8,fontSize*maxWidth/ctx.measureText(label).width);
      ctx.font=`900 ${fontSize}px system-ui,Arial,sans-serif`;
    }
    ctx.lineWidth=clamp(fontSize*.27,2,5);
    ctx.strokeStyle='#1d1735da';ctx.strokeText(label,0,1);
    ctx.fillStyle='#fff';ctx.fillText(label,0,1);
    ctx.restore();ctx.restore();
  }
  function render(){
    ctx.clearRect(0,0,W,H);
    // Drop lane: separate from cardboard bin.
    const sky=ctx.createLinearGradient(0,0,0,boxTop+40);
    sky.addColorStop(0,'#4e3c90');sky.addColorStop(1,'#7a578c');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#d4a573';ctx.fillRect(9,boxTop-3,W-18,H-boxTop+3);
    const cardboard=ctx.createLinearGradient(0,boxTop,0,floor);
    cardboard.addColorStop(0,'#c9905e');cardboard.addColorStop(.5,'#d3a272');cardboard.addColorStop(1,'#aa7147');
    ctx.fillStyle=cardboard;ctx.fillRect(left,boxTop,right-left,floor-boxTop);
    ctx.save();ctx.beginPath();ctx.rect(left,boxTop,right-left,floor-boxTop);ctx.clip();
    // Simple deterministic corrugation and recycled-paper fibers; no image downloads.
    for(let y=boxTop+9;y<floor;y+=19){ctx.strokeStyle=(Math.floor(y)%2)?'#fff1':'#7a4b2315';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();}
    for(let x=left+19;x<right;x+=42){ctx.strokeStyle='#7a4b2309';ctx.beginPath();ctx.moveTo(x,boxTop);ctx.lineTo(x+7,floor);ctx.stroke();}
    const vignette=ctx.createLinearGradient(left,0,right,0);
    vignette.addColorStop(0,'#6b381a55');vignette.addColorStop(.12,'transparent');vignette.addColorStop(.88,'transparent');vignette.addColorStop(1,'#6b381a55');
    ctx.fillStyle=vignette;ctx.fillRect(left,boxTop,right-left,floor-boxTop);
    // Overflow line inside the cardboard bin.
    ctx.setLineDash([10,7]);ctx.strokeStyle=overflowAge>0?'#ff5555':'#f6a9a1';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(left+5,overflowY);ctx.lineTo(right-5,overflowY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#743e3b';ctx.font='bold 12px system-ui,Arial';ctx.textAlign='center';ctx.fillText('OVERFLOW LINE',W/2,overflowY-10);
    if(overflowAge>0){ctx.fillStyle='#f5515766';ctx.fillRect(left,overflowY-4,(right-left)*overflowAge/3,5);}
    for(const b of balls)drawSphere(b.x,b.y,b.r,b.level,false,b.pulse,b.angle,b.squish,b.squishAxis);
    for(const w of shockwaves){
      ctx.globalAlpha=(w.life/w.maxLife)*.55;
      ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);
      ctx.strokeStyle=w.color;ctx.lineWidth=5*(w.life/w.maxLife)+1;ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.restore();
    // Cardboard sidewalls and bottom, drawn in front of the spheres.
    ctx.fillStyle='#a76b3c';ctx.fillRect(9,boxTop-5,left-9,floor-boxTop+13);
    ctx.fillRect(right,boxTop-5,W-9-right,floor-boxTop+13);
    ctx.fillStyle='#d4a06b';ctx.fillRect(9,boxTop-5,W-18,9);
    ctx.fillStyle='#8c5934';ctx.fillRect(9,floor,W-18,15);
    ctx.strokeStyle='#f0c38e';ctx.lineWidth=2;
    ctx.strokeRect(10,boxTop-3,W-20,floor-boxTop+17);
    // Dashed aiming line + hovering ball. Only while the game is active.
    if(!ended){
      const dropR=radius(current),x=clamp(aimX,left+dropR,right-dropR);
      ctx.save();ctx.beginPath();ctx.setLineDash([5,6]);ctx.strokeStyle='#eee3ff99';ctx.lineWidth=2;
      ctx.moveTo(x,boxTop-dropR-10);ctx.lineTo(x,overflowY-3);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      drawSphere(x,boxTop-dropR-10,dropR,current,true);
    }
    for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
    for(const f of floating){ctx.globalAlpha=Math.min(1,f.life*1.7);ctx.font='900 13px system-ui,Arial';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#29203d';ctx.strokeText(f.label,f.x,f.y);ctx.fillStyle='#fff';ctx.fillText(f.label,f.x,f.y);}
    ctx.globalAlpha=1;
  }
  function frame(ms){
    if(!lastFrame)lastFrame=ms;
    accumulator+=clamp((ms-lastFrame)/1000,0,.05);lastFrame=ms;
    let loops=0;while(accumulator>=step&&loops<4){physics(step);accumulator-=step;loops++;}
    render();requestAnimationFrame(frame);
  }
  function aimFromPointer(e){
    const rect=canvas.getBoundingClientRect();
    const local=(e.clientX-rect.left)*W/rect.width;
    aimX=clamp(local,left+radius(current),right-radius(current));
  }
  canvas.addEventListener('pointerdown',e=>{if(ended)return;e.preventDefault();aimFromPointer(e);down=true;canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!ended)aimFromPointer(e);});
  canvas.addEventListener('pointerup',e=>{if(!down)return;down=false;aimFromPointer(e);drop();});
  canvas.addEventListener('pointercancel',()=>{down=false;});
  document.addEventListener('keydown',e=>{
    if(ended||e.altKey||e.ctrlKey||e.metaKey)return;
    if(['ArrowLeft','ArrowRight','Space',' '].includes(e.code)||['ArrowLeft','ArrowRight',' '].includes(e.key)){
      const target=e.target;
      if(target&&['INPUT','TEXTAREA','SELECT'].includes(target.tagName))return;
      e.preventDefault();
      if(e.key==='ArrowLeft')aimX=clamp(aimX-25,left+radius(current),right-radius(current));
      else if(e.key==='ArrowRight')aimX=clamp(aimX+25,left+radius(current),right-radius(current));
      else if(!e.repeat)drop();
    }
  });
  $('dropButton').addEventListener('click',drop);
  $('leftButton').addEventListener('click',()=>aimX=clamp(aimX-28,left+radius(current),right-radius(current)));
  $('rightButton').addEventListener('click',()=>aimX=clamp(aimX+28,left+radius(current),right-radius(current)));
  $('restartTop').addEventListener('click',reset);
  $('playAgain').addEventListener('click',reset);
  window.addEventListener('resize',resize);
  resize();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
