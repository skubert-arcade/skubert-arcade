<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d6c8ae">
  <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico">
  <title>Where's Skubert? · Skubert Arcade</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff9eb;background:#ded0b8}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffe3a4;outline-offset:3px}
    .game{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#d5c5a6}
    .viewport{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-behavior:auto;scrollbar-width:none;touch-action:pan-x;cursor:grab;user-select:none;-webkit-user-select:none}
    .viewport::-webkit-scrollbar{display:none}
    .viewport.dragging{cursor:grabbing}
    .strip{display:flex;height:100%;width:max-content;align-items:stretch}
    .panel{height:100%;display:flex;flex:none;position:relative}
    .tile{height:100%;width:auto;flex:none;aspect-ratio:512 / 145;position:relative;background:#e1d5bf}
    .tile img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
    /* Future Skubert: a TRANSPARENT, separate DOM layer per historical panel.
       Nothing has been added to the tapestry pixels or this layer in v2. */
    .character-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
    .character-layer .character-target{position:absolute;pointer-events:auto;padding:0;border:0;background:none;cursor:pointer}
    .character-layer .character-target img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}
    .chromebar{position:absolute;left:0;right:0;top:0;z-index:10;padding:12px 16px 30px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;background:linear-gradient(#201912b8,#20191250 64%,transparent)}
    .head-left,.head-right{display:flex;align-items:center;gap:12px;pointer-events:auto}
    .home{border:1px solid #fff5df63;border-radius:999px;color:#fff8e8;padding:5px 12px;background:#241a14a0;text-decoration:none;font-size:12px;font-weight:750;backdrop-filter:blur(8px)}
    .home:hover{background:#3d2e20da}
    .heading{font:700 15px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em;text-shadow:0 1px 5px #180d07b0;white-space:nowrap}
    .location{font-size:11px;font-weight:750;letter-spacing:.02em;white-space:nowrap;text-shadow:0 1px 4px #29180cb0}
    .hint{position:absolute;top:50%;z-index:6;transform:translateY(-50%);width:39px;height:66px;border-radius:11px;border:1px solid #fff5dc70;background:#241a149e;color:white;font-size:28px;display:flex;justify-content:center;align-items:center;backdrop-filter:blur(6px);box-shadow:0 2px 12px #29120857;opacity:.7;transition:opacity .15s,background .15s}
    .hint:hover{opacity:1;background:#241a14e5}
    .hint:disabled{opacity:.13;cursor:default}
    .hint.prev{left:10px}.hint.next{right:10px}
    .controls{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:12px;width:min(690px,calc(100vw - 24px));padding:8px 13px 8px 15px;border:1px solid #fff7e46b;border-radius:999px;background:#251d17d6;box-shadow:0 5px 22px #2b1c124a;backdrop-filter:blur(14px)}
    .position{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.03em;color:#fff7e9;min-width:35px}
    .seek{--progress:0%;appearance:none;-webkit-appearance:none;flex:1;width:100%;height:5px;border-radius:999px;margin:0;background:linear-gradient(to right,#ffd89f var(--progress),#fff8e158 var(--progress));cursor:pointer}
    .seek::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#ffe0a9;border:2px solid #33241b;box-shadow:0 0 0 1px #f7e3ba}
    .seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#ffe0a9;border:2px solid #33241b}
    .control-btn{min-width:34px;height:30px;background:none;border:1px solid #f4dcac5e;border-radius:100px;color:#fff6e9;font-size:14px;font-weight:800;display:grid;place-items:center;padding:0 6px}
    .control-btn:hover{background:#ffecb62c}
    .overlay-note{position:absolute;top:53px;left:16px;z-index:7;border-radius:9px;background:#291e15ad;color:#fff6e5;font-size:11px;padding:6px 10px;max-width:min(370px,calc(100% - 32px));backdrop-filter:blur(8px);pointer-events:none;opacity:.9}
    .overlay-note.dismissed{display:none}
    .character-found{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;max-width:calc(100% - 32px);padding:28px 32px;text-align:center;border:1px solid #fff0bf99;border-radius:19px;background:#2e2119e8;color:#fff7e6;box-shadow:0 15px 60px #0008;backdrop-filter:blur(14px)}
    .character-found h2{font:700 28px Georgia,serif;margin:0 0 7px}.character-found p{margin:0 0 16px;font-size:14px}
    .character-found button{border:0;border-radius:8px;background:#edc689;padding:10px 18px;color:#2c2014;font-weight:800}
    @media(max-width:620px){.chromebar{padding:8px 8px 26px}.home{font-size:11px;padding:5px 9px}.heading{font-size:13px}.location{font-size:10px}.head-left,.head-right{gap:6px}.hint{width:29px;height:56px;top:48%;font-size:23px}.hint.prev{left:4px}.hint.next{right:4px}.controls{bottom:7px;padding:7px 10px;gap:8px}.overlay-note{top:48px;left:8px;font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<main class="game" aria-label="Bayeux Tapestry viewer">
  <div id="viewport" class="viewport" tabindex="0" role="region" aria-label="The Bayeux Tapestry in one long row. Drag sideways, swipe, use the mouse wheel, or arrow keys to move right and left.">
    <div id="strip" class="strip">
      <!-- The imagery is created below, in 36 crisp tiles. The separate character
           layers remain EMPTY until we add Skubert in a later version. -->
    </div>
  </div>

  <header class="chromebar">
    <div class="head-left">
      <a class="home" href="../../index.html" aria-label="Back to Skubert Arcade">← Arcade</a>
      <div class="heading">Where’s Skubert?</div>
    </div>
    <div class="head-right"><div id="positionLabel" class="location">Scene 1 of 9 · 0%</div></div>
  </header>
  <div class="overlay-note" id="introNote">Drag or scroll right to explore the entire tapestry.</div>
  <button type="button" class="hint prev" id="previous" aria-label="Scroll left">‹</button>
  <button type="button" class="hint next" id="next" aria-label="Scroll right">›</button>
  <div class="controls" aria-label="Horizontal navigation controls">
    <span class="position" id="percent">0%</span>
    <input class="seek" id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position along the tapestry">
    <button type="button" class="control-btn" id="auto" aria-pressed="false" aria-label="Start automatic scrolling" title="Auto-scroll">▶</button>
  </div>
  <div id="found" class="character-found" hidden>
    <h2>Skubert found!</h2>
    <p>The hidden character was discovered.</p>
    <button id="closeFound" type="button">Keep exploring</button>
  </div>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const viewport=$('viewport'), strip=$('strip'), seek=$('seek'), note=$('introNote');
  const TILE_COUNT=9, TILES_PER_SCENE=4;
  const AUTO_SCROLL_PX_PER_SECOND=310;
  // RESERVED FOR A FUTURE UPDATE. The tapestry files contain NO Skubert.
  // When ready, replace null with an object such as:
  // { scene: 6, xPercent: 50, yPercent: 46, widthPercent: 3.0, src: 'assets/skubert-overlay.png' }
  const SKUBERT_OVERLAY=null;
  const panels=[];
  let auto=false, lastFrame=0, dragging=false, moved=0, pointerId=null;
  let dragStartX=0,dragStartScroll=0;
  const maxScroll=()=>Math.max(0,viewport.scrollWidth-viewport.clientWidth);
  const path=(scene,tile)=>`assets/tapestry-${String(scene).padStart(2,'0')}-${String(tile).padStart(2,'0')}.webp`;

  for(let scene=1;scene<=TILE_COUNT;scene++){
    const panel=document.createElement('section');
    panel.className='panel';panel.dataset.scene=scene;
    panel.setAttribute('aria-label',`Tapestry scene group ${scene} of ${TILE_COUNT}`);
    for(let tile=1;tile<=TILES_PER_SCENE;tile++){
      const part=document.createElement('div');part.className='tile';
      const img=document.createElement('img');
      img.alt='';img.width=4096;img.height=1160;img.decoding='async';img.draggable=false;
      img.dataset.src=path(scene,tile);
      if(scene===1 && tile<=2){img.src=img.dataset.src;img.fetchPriority='high';}
      part.appendChild(img);panel.appendChild(part);
    }
    const layer=document.createElement('div');layer.className='character-layer';
    layer.dataset.scene=scene;layer.setAttribute('aria-label',`Reserved character layer ${scene}`);
    panel.appendChild(layer);strip.appendChild(panel);panels.push(panel);
  }

  // Deferred tile loading: fetch nearby panels without decoding all 36 at once.
  const images=[...strip.querySelectorAll('img')];
  if('IntersectionObserver' in window){
    const observer=new IntersectionObserver(entries=>{
      for(const entry of entries){
        if(entry.isIntersecting){
          const img=entry.target;
          if(!img.src)img.src=img.dataset.src;
          observer.unobserve(img);
        }
      }
    },{root:viewport,rootMargin:'0px 5000px 0px 5000px',threshold:0});
    images.forEach(img=>{if(!img.src)observer.observe(img);});
  }else images.forEach(img=>{if(!img.src)img.src=img.dataset.src;});

  // This future target is in its OWN DOM layer, independent of the tapestry assets.
  if(SKUBERT_OVERLAY){
    const config=SKUBERT_OVERLAY;
    const layer=panels[config.scene-1]?.querySelector('.character-layer');
    if(layer){
      const button=document.createElement('button');button.type='button';
      button.className='character-target';button.setAttribute('aria-label','I found Skubert!');
      button.style.left=`${config.xPercent}%`;button.style.top=`${config.yPercent}%`;
      button.style.width=`${config.widthPercent}%`;
      button.innerHTML=`<img alt="" draggable="false">`;
      button.querySelector('img').src=config.src;
      button.addEventListener('click',() => {setAuto(false);$('found').hidden=false;});
      layer.appendChild(button);
    }
  }

  function updateProgress(){
    const max=maxScroll();const pct=max ? viewport.scrollLeft/max*100 : 0;
    const scene=Math.min(TILE_COUNT,1+Math.floor((viewport.scrollLeft+viewport.clientWidth*.5)/(panels[0]?.offsetWidth||1)));
    $('positionLabel').textContent=`Scene ${scene} of 9 · ${Math.round(pct)}%`;
    $('percent').textContent=`${Math.round(pct)}%`;
    seek.value=Math.round(pct*10);seek.style.setProperty('--progress',`${pct}%`);
    $('previous').disabled=viewport.scrollLeft<=1;
    $('next').disabled=viewport.scrollLeft>=max-1;
    if(auto && viewport.scrollLeft>=max-1)setAuto(false);
  }
  function setAuto(enabled){auto=Boolean(enabled);$('auto').textContent=auto?'Ⅱ':'▶';$('auto').setAttribute('aria-pressed',String(auto));$('auto').setAttribute('aria-label',auto?'Pause automatic scrolling':'Start automatic scrolling');}
  function scrollByAmount(dx){setAuto(false);viewport.scrollBy({left:dx,behavior:'smooth'});}
  function dismissNote(){note.classList.add('dismissed')}
  viewport.addEventListener('scroll',()=>{updateProgress();if(viewport.scrollLeft>30)dismissNote()},{passive:true});
  window.addEventListener('resize',updateProgress);
  viewport.addEventListener('wheel',e=>{
    e.preventDefault();dismissNote();setAuto(false);
    const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    viewport.scrollLeft+=delta*(e.deltaMode===1?34:1.65);
  },{passive:false});
  viewport.addEventListener('pointerdown',e=>{
    if(e.target.closest('.character-target') || (e.pointerType!=='mouse'&&e.pointerType!=='pen'))return;
    dragging=true;moved=0;pointerId=e.pointerId;dragStartX=e.clientX;dragStartScroll=viewport.scrollLeft;
    viewport.classList.add('dragging');viewport.setPointerCapture(pointerId);
    setAuto(false);dismissNote();
  });
  viewport.addEventListener('pointermove',e=>{
    if(!dragging||e.pointerId!==pointerId)return;
    moved=Math.max(moved,Math.abs(e.clientX-dragStartX));
    viewport.scrollLeft=dragStartScroll+(dragStartX-e.clientX);
  });
  function endDrag(e){if(e.pointerId!==pointerId)return;dragging=false;pointerId=null;viewport.classList.remove('dragging');}
  viewport.addEventListener('pointerup',endDrag);
  viewport.addEventListener('pointercancel',endDrag);
  viewport.addEventListener('lostpointercapture',()=>{dragging=false;pointerId=null;viewport.classList.remove('dragging')});
  $('previous').addEventListener('click',()=>scrollByAmount(-viewport.clientWidth*.78));
  $('next').addEventListener('click',()=>scrollByAmount(viewport.clientWidth*.78));
  seek.addEventListener('input',()=>{setAuto(false);dismissNote();viewport.scrollLeft=maxScroll()*Number(seek.value)/1000;});
  $('auto').addEventListener('click',()=>{dismissNote();setAuto(!auto)});
  $('closeFound').addEventListener('click',()=>{$('found').hidden=true;viewport.focus({preventScroll:true});});
  document.addEventListener('keydown',e=>{
    if(['INPUT','BUTTON','TEXTAREA','A'].includes(document.activeElement?.tagName))return;
    if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){e.preventDefault();scrollByAmount(viewport.clientWidth*.38);}
    else if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){e.preventDefault();scrollByAmount(-viewport.clientWidth*.38);}
    else if(e.key==='PageDown'||e.key===' '){e.preventDefault();scrollByAmount(viewport.clientWidth*.85);}
    else if(e.key==='PageUp'){e.preventDefault();scrollByAmount(-viewport.clientWidth*.85);}
    else if(e.key==='Home'){e.preventDefault();viewport.scrollLeft=0;}
    else if(e.key==='End'){e.preventDefault();viewport.scrollLeft=maxScroll();}
  });
  function tick(t){
    if(auto){const dt=Math.min(.05,(t-lastFrame)/1000||0);viewport.scrollLeft+=AUTO_SCROLL_PX_PER_SECOND*dt;}
    lastFrame=t;requestAnimationFrame(tick);
  }
  updateProgress();requestAnimationFrame(tick);
  setTimeout(dismissNote,7000);
})();
</script>
</body>
</html>
